services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: store_rating_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: store_rating_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full-Stack Application Service (Node/Express Backend + Built React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_rating_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: store_rating_db
      DB_PORT: 3306
      JWT_SECRET: supersecretjwtkey_store_rating_production_ready_2026
      JWT_EXPIRES_IN: 24h
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "node backend/config/initDb.js && node backend/server.js"

volumes:
  mysql_data:
